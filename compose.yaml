#
# AFFiNE for FreeBSD (Daemonless)
#
# Usage:
#   1. Copy example.env to .env and edit
#   2. Run: podman-compose up -d
#

name: affine

x-daemonless:
  title: "AFFiNE"
  icon: ":simple-affine:"
  category: "Productivity"
  description: "AFFiNE is an open-source, privacy-first, local-first knowledge management and collaboration tool."
  upstream_url: "https://github.com/toeverything/AFFiNE"
  web_url: "https://affine.pro/"
  user: "bsd"
  mlock: false
  community: "Discord:https://discord.gg/Kb9tkhecZT"
  # affine is the one people open; redis and postgres stay on the stack's
  # private network, where affine finds them by the names fjord puts in
  # REDIS_SERVER_HOST and POSTGRES_HOSTNAME (localhost on host networking).
  networking:
    affine: default
    "*": private
  hostnames:
    redis: REDIS_SERVER_HOST
    postgres: POSTGRES_HOSTNAME
  # Sidecars for the AppJail director bundle (podman reads the services
  # below; director renders the app from them plus these). Named as the
  # services are, so fjord finds each jail by the service's name.
  appjail:
    director:
      options:
        - alias:
        - ip4_inherit:
    depends_on:
      - name: redis
        image: ghcr.io/daemonless/redis:latest
      - name: postgres
        image: ghcr.io/daemonless/postgres:latest
        template: postgres-template.conf
        env:
          POSTGRES_USER: affine
          POSTGRES_PASSWORD: "!ENV '${DB_PASSWORD}'"
          POSTGRES_DB: affine
          POSTGRES_EXTENSIONS: pgvector
        volumes:
          db_data: /var/lib/postgresql/data

  docs:
    manual: true
    env:
      DB_DATA_LOCATION: "Path to store PostgreSQL data files"
      AFFINE_DATA_LOCATION: "Path to store AFFiNE config and uploads"
      DB_PASSWORD: "PostgreSQL password"
      TZ:
        desc: "Timezone"
        optional: true
      AFFINE_SERVER_HOST: "Public hostname for AFFiNE (e.g. affine.example.com)"
      AFFINE_SERVER_HTTPS: "Set to true if serving over HTTPS (default: false)"
      AFFINE_INDEXER_ENABLED: "Enable document indexer (default: false)"
      DATABASE_URL: "PostgreSQL connection string"
      REDIS_SERVER_HOST:
        desc: "Where affine finds redis (fjord sets this; localhost on host networking)"
        level: advanced
        optional: true
      POSTGRES_HOSTNAME:
        desc: "Where affine finds postgres (fjord sets this; localhost on host networking)"
        level: advanced
        optional: true
    ports:
      3010: "Web UI and API"

services:
  affine:
    image: ghcr.io/daemonless/affine:latest
    container_name: affine
    network_mode: host
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://affine:${DB_PASSWORD}@${POSTGRES_HOSTNAME:-localhost}:5432/affine
      REDIS_SERVER_HOST: ${REDIS_SERVER_HOST:-localhost}
      AFFINE_INDEXER_ENABLED: "false"
      TZ: ${TZ:-UTC}
    env_file:
      - .env
    volumes:
      - ${AFFINE_DATA_LOCATION}:/config
    depends_on:
      - redis
      - postgres

  redis:
    image: ghcr.io/daemonless/redis:latest
    container_name: affine_redis
    network_mode: host
    restart: unless-stopped

  postgres:
    image: ghcr.io/daemonless/postgres:latest
    container_name: affine_postgres
    network_mode: host
    restart: unless-stopped
    annotations:
      org.freebsd.jail.allow.sysvipc: "true"
    environment:
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: affine
      POSTGRES_EXTENSIONS: pgvector
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
